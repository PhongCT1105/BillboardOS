site_name: BillboardOS
site_description: Documentation for the BillboardOS Cal Hacks 13.0 project
repo_url: https://github.com/PhongCT1105/BillboardOS
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Competition:
      - Guide & rules: competition/index.md
      - Sponsor track catalog: competition/sponsor-tracks.md
      - Original guide extracted text: competition/official-guide-text.md
      - Track strategy: competition/track-strategy.md
      - Source register: competition/sources.md
  - Sponsors:
      - sponsors/index.md
      - Hyphenate: sponsors/hyphenate.md
      - Coinbase x402: sponsors/coinbase-x402.md
      - CREAO: sponsors/creao.md
      - CRS: sponsors/crs.md
      - Convex: sponsors/convex.md
      - Capital One Nessie: sponsors/capital-one-nessie.md
      - Anthropic: sponsors/anthropic.md
      - Microsoft: sponsors/microsoft.md
      - Fetch.ai: sponsors/fetch-ai.md
  - Product:
      - Product vision: product/vision.md
      - MVP requirements: product/requirements.md
  - Architecture:
      - System overview: architecture/overview.md
      - Agent protocol: architecture/agents.md
      - Payments & risk: architecture/payments-and-risk.md
      - Data model: architecture/data-model.md
      - Agent API: architecture/agent-api.md
  - Development:
      - Kickoff checklist: development/kickoff-checklist.md
      - Getting started: development/getting-started.md
      - Roadmap: development/roadmap.md
  - Demo: demo/judging.md
  - Notes:
      - Original ideation: notes/ideation.md
      - Open questions: notes/open-questions.md
  - Decisions:
      - 0001 Scope: decisions/0001-scope.md
      - 0002 Sponsor-native stack: decisions/0002-sponsor-native-stack.md
      - 0003 Pricing harness and bidding: decisions/0003-pricing-harness-and-bidding.md
      - 0004 Two-sided marketplace: decisions/0004-two-sided-marketplace.md
      - 0005 Agent-to-agent x402: decisions/0005-agent-to-agent-x402.md
